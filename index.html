<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <!-- Connexions ouvertes tôt : tuiles de la carte (élément LCP) et services de données. -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://mesonet.agron.iastate.edu" crossorigin />
    <meta
      name="description"
      content="HygroPoint — estimation de l'humidité relative de l'air à l'endroit précis que vous désignez : 24 h passées, maintenant, 72 h à venir, calée sur des mesures réelles lorsqu'elles existent."
    />
    <link rel="canonical" href="https://labo.bissestudio.ch/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="HygroPoint — Humidité relative précise" />
    <meta property="og:description" content="Estimation de l'humidité relative de l'air à l'endroit précis que vous désignez : 24 h passées, maintenant, 72 h à venir." />
    <meta property="og:url" content="https://labo.bissestudio.ch/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_CH" />
    <meta property="og:image" content="https://labo.bissestudio.ch/og-image.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "HygroPoint",
      "url": "https://labo.bissestudio.ch/",
      "description": "Estimation de l'humidité relative de l'air à un point précis : 24 h passées, maintenant, 72 h à venir, calée sur les mesures des stations météo proches.",
      "applicationCategory": "WeatherApplication",
      "operatingSystem": "Web",
      "author": {
        "@type": "Organization",
        "name": "Bisse Studio",
        "url": "https://bissestudio.ch"
      },
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CHF" },
      "inLanguage": "fr"
    }
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>HygroPoint — Humidité relative précise</title>
    <style>
      body{background:#020617;margin:0}
      .hp-shell{max-width:80rem;margin:0 auto;padding:1.25rem 1rem 3.5rem}
      .hp-banner{height:2.25rem;border-radius:.5rem;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25)}
      .hp-header{display:flex;gap:.75rem;align-items:center;margin:1.25rem 0 1rem}
      .hp-logo{width:3rem;height:3rem;border-radius:1rem;background:linear-gradient(135deg,#38bdf8,#6366f1)}
      .hp-title{height:2rem;width:12rem;border-radius:.5rem;background:rgba(255,255,255,.08)}
      .hp-search{height:3rem;flex:1;border-radius:1rem;background:rgba(255,255,255,.06);margin-left:auto}
      .hp-status{height:.9rem;width:60%;border-radius:.4rem;background:rgba(255,255,255,.06);margin-bottom:1rem}
      .hp-hero{display:grid;gap:1.25rem;min-height:760px}
      .hp-now,.hp-map{border-radius:1.5rem;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}
      .hp-now{min-height:420px}
      .hp-map{min-height:320px;background:#0f172a}
      @media(min-width:1024px){.hp-hero{grid-template-columns:minmax(0,1fr) 380px;min-height:440px}.hp-now,.hp-map{min-height:440px}}
      @media(prefers-reduced-motion:no-preference){
        .hp-now,.hp-map,.hp-title,.hp-search{animation:hp-pulse 1.6s ease-in-out infinite}
        @keyframes hp-pulse{0%,100%{opacity:1}50%{opacity:.55}}
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Squelette immediat : meme gabarit que le hero React, pour un CLS proche de zero. -->
      <div class="hp-shell" aria-hidden="true">
        <div class="hp-banner"></div>
        <div class="hp-header"><div class="hp-logo"></div><div class="hp-title"></div><div class="hp-search"></div></div>
        <div class="hp-status"></div>
        <div class="hp-hero">
          <div class="hp-now"></div>
          <div class="hp-map"><img src="https://tile.openstreetmap.org/12/2074/1409.png" alt="" fetchpriority="high" width="256" height="256" style="width:100%;height:100%;object-fit:cover" /></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
