name: Vérification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, tests et build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Vérifier le projet
        run: npm run check

      - name: Publier le build monofichier
        uses: actions/upload-artifact@v4
        with:
          name: hygropoint-dist
          path: dist/index.html
          if-no-files-found: error
